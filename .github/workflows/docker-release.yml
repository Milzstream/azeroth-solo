name: docker-release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/milzstream/azeroth-solo
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.source=https://github.com/Milzstream/azeroth-solo

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Add swap for the image compile
        run: |
          set -euo pipefail
          # The OOM mitigation is the job cap of 2. Swap is extra.
          # GitHub-hosted ubuntu-22.04 already has /swapfile active;
          # fallocate on that path returns ETXTBSY ("Text file busy") and
          # must not fail the job.
          echo "Existing swap:"
          swapon --show || true
          free -h || true
          if [ -n "$(swapon --show || true)" ]; then
            echo "Swap is already enabled; keeping it."
          else
            echo "No swap active; trying /swapfile-ci via dd."
            if ! sudo dd if=/dev/zero of=/swapfile-ci bs=1M count=8192 status=progress; then
              echo "::warning::Could not create /swapfile-ci (likely disk space). Continuing without extra swap."
              sudo rm -f /swapfile-ci || true
            elif ! sudo chmod 600 /swapfile-ci || ! sudo mkswap /swapfile-ci || ! sudo swapon /swapfile-ci; then
              echo "::warning::Could not enable /swapfile-ci. Continuing without extra swap."
              sudo swapoff /swapfile-ci || true
              sudo rm -f /swapfile-ci || true
            fi
          fi
          free -h || true

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docker/Dockerfile
          target: server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_JOBS=2
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
