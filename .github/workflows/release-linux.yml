# Build the AMP Linux runtime and a Windows Docker support bundle from main.
# Docker images are published separately by docker-release.yml.
name: release-linux

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-tools:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/windows-extractor-tools.yml

  linux:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Validate source snapshot
        shell: bash
        run: |
          set -euo pipefail
          source pins.env
          test -f CMakeLists.txt
          test -d modules/mod-playerbots/src
          test -d modules/mod-individual-progression/src
          test -d modules/mod-ollama-chat/src
          test -d modules/mod-dungeon-clear/src
          test -d modules/mod-ah-bot/src

      - name: Install build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake make gcc g++ clang \
            libmysqlclient-dev libssl-dev libbz2-dev \
            libreadline-dev libncurses-dev mysql-server libboost-all-dev

      - name: Add swap for the Release compile
        run: |
          set -euo pipefail
          # The OOM mitigation is the job cap of 2. Swap is extra.
          # GitHub-hosted ubuntu-22.04 already has /swapfile active;
          # fallocate on that path returns ETXTBSY ("Text file busy") and
          # must not fail the job.
          echo "Existing swap:"
          swapon --show || true
          free -h || true
          if [ -n "$(swapon --show || true)" ]; then
            echo "Swap is already enabled; keeping it."
          else
            echo "No swap active; trying /swapfile-ci via dd."
            if ! sudo dd if=/dev/zero of=/swapfile-ci bs=1M count=8192 status=progress; then
              echo "::warning::Could not create /swapfile-ci (likely disk space). Continuing without extra swap."
              sudo rm -f /swapfile-ci || true
            elif ! sudo chmod 600 /swapfile-ci || ! sudo mkswap /swapfile-ci || ! sudo swapon /swapfile-ci; then
              echo "::warning::Could not enable /swapfile-ci. Continuing without extra swap."
              sudo swapoff /swapfile-ci || true
              sudo rm -f /swapfile-ci || true
            fi
          fi
          free -h || true

      - name: Configure and build
        run: |
          set -euo pipefail
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/ac-install" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,--no-keep-memory" \
            -DCONF_DIR=etc \
            -DTOOLS_BUILD=db-only
          # --parallel with no number uses every core and OOM-kills cc1plus.
          # Two jobs is the mitigation; swap above is only extra.
          jobs="$(nproc)"
          if [ "$jobs" -gt 2 ]; then
            jobs=2
          fi
          echo "Compiling with ${jobs} jobs (nproc=$(nproc))"
          cmake --build build --config Release --parallel "$jobs"
          cmake --install build --config Release

      - name: Stage AMP server tree
        shell: bash
        run: |
          set -euo pipefail
          inst="$RUNNER_TEMP/ac-install"
          stage="$RUNNER_TEMP/stage"
          core="$GITHUB_WORKSPACE"
          rm -rf "$stage"
          mkdir -p "$stage/bin" "$stage/etc/modules" "$stage/configs/modules"

          for binary in authserver worldserver dbimport; do
            if [ ! -f "$inst/bin/$binary" ]; then
              echo "missing installed binary: $inst/bin/$binary" >&2
              exit 1
            fi
            cp -a "$inst/bin/$binary" "$stage/bin/$binary"
          done

          cp -a "$inst/etc/." "$stage/etc/"
          shopt -s nullglob
          for conf in "$stage"/etc/*.conf.dist "$stage"/etc/modules/*.conf.dist; do
            cp -f "$conf" "${conf%.dist}"
          done

          for conf in "$stage"/etc/authserver.conf "$stage"/etc/worldserver.conf "$stage"/etc/dbimport.conf; do
            sed -i \
              -e 's|^SourceDirectory *=.*|SourceDirectory = "sql/core"|' \
              -e 's|^MySQLExecutable *=.*|MySQLExecutable = "mysql"|' \
              "$conf"
          done
          sed -i \
            -e 's|^DataDir *=.*|DataDir = "data"|' \
            -e 's|^MapUpdate.Threads *=.*|MapUpdate.Threads = 4|' \
            "$stage/etc/worldserver.conf"
          sed -i \
            -e 's|^AiPlayerbot.MinRandomBots *=.*|AiPlayerbot.MinRandomBots = 50|' \
            -e 's|^AiPlayerbot.MaxRandomBots *=.*|AiPlayerbot.MaxRandomBots = 150|' \
            -e 's|^AiPlayerbot.ApplyInstanceStrategies *=.*|AiPlayerbot.ApplyInstanceStrategies = 0|' \
            "$stage/etc/modules/playerbots.conf"
          sed -i \
            -e 's|^IndividualProgression.Enable *=.*|IndividualProgression.Enable = 1|' \
            -e 's|^IndividualProgression.StartingProgression *=.*|IndividualProgression.StartingProgression = 0|' \
            "$stage/etc/modules/individualProgression.conf"
          sed -i 's|^OllamaChat.Enable *=.*|OllamaChat.Enable = 0|' "$stage/etc/modules/mod_ollama_chat.conf"
          sed -i \
            -e 's|^AuctionHouseBot.EnableSeller *=.*|AuctionHouseBot.EnableSeller = 0|' \
            -e 's|^AuctionHouseBot.EnableBuyer *=.*|AuctionHouseBot.EnableBuyer = 0|' \
            "$stage/etc/modules/mod_ahbot.conf"

          cp -a "$stage/etc/." "$stage/configs/"
          mkdir -p "$stage/sql/core/data/sql/custom/db_auth"
          cp -a "$core/data/sql/." "$stage/sql/core/data/sql/"
          cp -f "$core"/sql/db_auth/*.sql "$stage/sql/core/data/sql/custom/db_auth/"
          for module in mod-playerbots mod-individual-progression mod-ollama-chat mod-ah-bot; do
            mkdir -p "$stage/sql/core/modules/$module"
            cp -a "$core/modules/$module/data" "$stage/sql/core/modules/$module/data"
          done

          rm -rf "$stage/data" "$stage/sql/core/env" "$stage"/maps "$stage"/vmaps "$stage"/mmaps "$stage"/dbc "$stage"/Cameras
          tar -C "$stage" -czf "$RUNNER_TEMP/solo-azeroth-linux-x86_64.tar.gz" .
          tar -tzf "$RUNNER_TEMP/solo-azeroth-linux-x86_64.tar.gz" | head -40

      - name: Upload AMP Linux package
        uses: actions/upload-artifact@v4
        with:
          name: solo-azeroth-linux-x86_64
          path: ${{ runner.temp }}/solo-azeroth-linux-x86_64.tar.gz
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [linux, windows-tools]
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Download AMP Linux package
        uses: actions/download-artifact@v4
        with:
          name: solo-azeroth-linux-x86_64
          path: ${{ runner.temp }}/release

      - name: Download Windows client tools
        uses: actions/download-artifact@v4
        with:
          name: windows-extractor-tools
          path: ${{ runner.temp }}/windows-tools

      - name: Package Docker support bundle
        shell: bash
        run: |
          set -euo pipefail
          support="$RUNNER_TEMP/docker-windows"
          mkdir -p "$support/scripts" "$support/sql/db_auth" "$support/env/dist/bin" "$support/modules/mod-ah-bot/conf"
          cp docker-compose.yml docker-compose.override.yml docker-compose.images.yml .env.example README.md "$support/"
          cp scripts/BuildAndStart.ps1 scripts/Stop.ps1 "$support/scripts/"
          cp sql/db_auth/*.sql "$support/sql/db_auth/"
          cp modules/mod-ah-bot/conf/mod_ahbot.conf.dist "$support/modules/mod-ah-bot/conf/"
          cp "$RUNNER_TEMP"/windows-tools/* "$support/env/dist/bin/"
          (cd "$support" && zip -qr "$RUNNER_TEMP/solo-azeroth-docker-windows-x86_64.zip" .)
          unzip -l "$RUNNER_TEMP/solo-azeroth-docker-windows-x86_64.zip" | head -40

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source pins.env
          tag="build-${GITHUB_RUN_ID}"
          gh release create "$tag" \
            --title "Solo Azeroth ${GITHUB_SHA::7}" \
            --notes "$(cat <<NOTES
          Linux authserver, worldserver, and dbimport with Playerbots, AH Bot, Dungeon Clear, Individual Progression, and Ollama Chat.
          AMP asset: solo-azeroth-linux-x86_64.tar.gz
          Windows Docker bundle: solo-azeroth-docker-windows-x86_64.zip (Compose manifests, scripts, realm SQL, extractor binaries, and required DLLs).
          No WoW client data is included. Extract maps, vmaps, mmaps, dbc, and Cameras from your own 3.3.5a client.
          Docker images are published separately to GHCR by docker-release.yml. Set ghcr.io/milzstream/azeroth-solo to Public for anonymous pulls.

          Source snapshot: ${GITHUB_SHA}
          Core: $AZEROTHCORE_SHA
          mod-playerbots: $PLAYERBOTS_SHA
          mod-ah-bot: $AH_BOT_SHA
          mod-dungeon-clear: $DUNGEON_CLEAR_SHA
          mod-individual-progression: $INDIVIDUAL_PROGRESSION_SHA
          mod-ollama-chat: $OLLAMA_CHAT_SHA
          NOTES
          )" \
            "$RUNNER_TEMP/release/solo-azeroth-linux-x86_64.tar.gz" \
            "$RUNNER_TEMP/solo-azeroth-docker-windows-x86_64.zip"