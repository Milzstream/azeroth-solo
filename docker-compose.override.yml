# Local test only. AMP does not use this file and does not run these containers.
# The base file is docker-compose.yml in this repo (imported with the core).
# This override is the supported extension point for Solo Azeroth settings.

services:
  ac-worldserver:
    environment:
      # Names follow IniKeyToEnvVarKey in the pinned core (Config.cpp): AC_ + uppercase, dot to _,
      # underscore before an uppercase letter. These keys exist in the pinned or vendored conf.dist files.
      AC_AI_PLAYERBOT_ENABLED: "1"
      AC_AI_PLAYERBOT_RANDOM_BOT_AUTOLOGIN: "1"
      AC_AI_PLAYERBOT_MIN_RANDOM_BOTS: "50"
      AC_AI_PLAYERBOT_MAX_RANDOM_BOTS: "150"
      AC_AI_PLAYERBOT_RANDOM_BOT_MAPS: "0,1,530,571"
      AC_AI_PLAYERBOT_AUTO_DO_QUESTS: "1"
      # worldserver.conf.dist default is 1. The playerbots install guide recommends 4-6.
      AC_MAP_UPDATE_THREADS: "4"
      # playerbots.conf.dist key AiPlayerbot.ApplyInstanceStrategies. Dist default 1.
      # Set to 0 (mod-playerbots issue 530 Naxxramas crash workaround).
      AC_AI_PLAYERBOT_APPLY_INSTANCE_STRATEGIES: "0"
      # individualProgression.conf.dist. Enable the module. StartingProgression 0 is
      # stage PROGRESSION_START (Classic, level cap 60, Molten Core and Onyxia), not Wrath.
      AC_INDIVIDUAL_PROGRESSION_ENABLE: "1"
      AC_INDIVIDUAL_PROGRESSION_STARTING_PROGRESSION: "0"
      # Ollama runs as a sibling container; localhost would point back to worldserver.
      AC_OLLAMA_CHAT_ENABLE: "1"
      AC_OLLAMA_CHAT_URL: "http://ollama:11434/api/generate"
      AC_AUCTION_HOUSE_BOT_ENABLE_SELLER: "${DOCKER_AHBOT_ENABLE_SELLER:-0}"
      AC_AUCTION_HOUSE_BOT_ENABLE_BUYER: "${DOCKER_AHBOT_ENABLE_BUYER:-0}"
      AC_AUCTION_HOUSE_BOT_ACCOUNT: "${DOCKER_AHBOT_ACCOUNT:-0}"
      AC_AUCTION_HOUSE_BOT_GUID: "${DOCKER_AHBOT_GUID:-0}"
    volumes:
      # worldserver applies playerbots SQL from the compiled source dir /azerothcore/modules.
      # The runtime image does not contain the module tree; the mount supplies it.
      - ./modules:/azerothcore/modules:ro
      - ./modules/mod-ah-bot/conf/mod_ahbot.conf.dist:/azerothcore/env/dist/etc/modules/mod_ahbot.conf:ro
    depends_on:
      ac-ollama-model-init:
        condition: service_completed_successfully

  ac-client-data-init:
    # The upstream image command downloads client data (inst_download_client_data).
    # Replace it. This stack refuses to start until you have mounted your own extract.
    entrypoint: ["bash", "-lc"]
    command:
      - |
        data=/azerothcore/env/dist/data
        missing=0
        for d in dbc maps vmaps mmaps; do
          if [ ! -d "$$data/$$d" ] || [ -z "$$(ls -A "$$data/$$d" 2>/dev/null || true)" ]; then
            echo "Missing extracted client data: $$data/$$d"
            missing=1
          fi
        done
        if [ ! -d "$$data/Cameras" ] || [ -z "$$(ls -A "$$data/Cameras" 2>/dev/null || true)" ]; then
          echo "Note: $$data/Cameras is empty. map_extractor also writes Cameras. Recommended, not checked as fatal."
        fi
        if [ "$$missing" -ne 0 ]; then
          echo "This setup does not download maps, vmaps, mmaps, dbc, or MPQs."
          echo "Extract them from your own 3.3.5a client and copy dbc, maps, vmaps, mmaps, and Cameras into the directory mounted at DOCKER_VOL_DATA."
          exit 1
        fi
        echo "Using locally extracted client data."
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - ac-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  ac-ollama-model-init:
    image: ollama/ollama:latest
    entrypoint: ["ollama"]
    command: ["pull", "llama3.2:1b"]
    environment:
      OLLAMA_HOST: "ollama:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - ac-network
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  ollama-models:
